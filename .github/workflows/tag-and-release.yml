name: Release on Version Change

on:
  workflow_dispatch:

# Fork: manual release trigger only (pushes to custom do not publish APKs on GitHub).
permissions:
  contents: write
  packages: read

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.detect_version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tags
        run: git fetch --tags origin

      - name: Detect Version Change
        id: detect_version
        run: |
          current_version=$(grep 'versionName' app/build.gradle.kts | sed -e 's/.*"\(.*\)".*/\1/' | head -n 1)
          echo "Current version: $current_version"

          if git tag -l | grep -q "^$current_version$"; then
            echo "Version $current_version already tagged. No new release will be created."
            exit 0
          elif [[ "$current_version" == *-* ]]; then
            echo "::error::versionName $current_version is a pre-release; bump to a stable version before releasing."
            exit 1
          fi

          current_code=$(grep 'versionCode' app/build.gradle.kts | sed -e 's/[^0-9]*//g' | head -n 1)
          latest_code=$(curl -fsSL https://github.com/Aryeh95/barberfish/releases/latest/download/manifest.json | jq -r '.latestVersionCode' 2>/dev/null || echo 0)
          if [[ -z "$latest_code" || "$latest_code" == "null" ]]; then
            latest_code=0
          fi
          echo "versionCode: $current_code (latest published: $latest_code)"
          if [[ "$current_code" -le "$latest_code" ]]; then
            echo "::error::versionCode $current_code does not exceed the latest published release's $latest_code. Bump versionCode along with versionName."
            exit 1
          fi

          echo "Version $current_version is new."
          echo "VERSION=$current_version" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ needs.check.outputs.VERSION }}"
          notes=$(awk "/^## $VERSION/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [[ "$notes" == *"]("* ]]; then
            echo "::error::The $VERSION changelog section contains a markdown link. The Karoo renders release notes as plain text; keep links out of version sections."
            exit 1
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests, detekt, and lint
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon test detektDebug lintDebug

      - name: Inject signing config
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > app/barberfish.keystore
          echo "signing.store.file=barberfish.keystore" >> local.properties
          echo "signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }}" >> local.properties
          echo "signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties

      - name: Assemble release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Generate manifest
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.NOTES }}
        run: ./gradlew --no-daemon generateManifest

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/barberfish.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.VERSION }}
          name: ${{ needs.check.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: |
            app/build/outputs/apk/release/barberfish.apk
            app/src/main/res/drawable/ic_extension.png
            app/manifest.json
